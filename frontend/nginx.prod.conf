# ===================================================================
# 🏛️ BCRG HUB — Configuration Nginx Production avec SSL/TLS (HTTPS)
# ===================================================================

# 1. Redirection HTTP vers HTTPS obligatoire
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# 2. Serveur Sécurisé HTTPS
server {
    listen 443 ssl http2;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Taille maximale des téléversements (certificats, exports, logs)
    client_max_body_size 25M;

    # Certificats SSL/TLS
    ssl_certificate /etc/nginx/ssl/bcrg_hub.crt;
    ssl_certificate_key /etc/nginx/ssl/bcrg_hub.key;

    # Protocoles et Chiffrements sécurisés (TLS 1.2 & 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # En-têtes de Sécurité HTTP renforcés
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Routage API : Relais vers le conteneur backend
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Transmission explicite des en-têtes d'authentification (JWT Bearer + Cookies de session)
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;
    }

    # Cache des ressources statiques
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Routage React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
