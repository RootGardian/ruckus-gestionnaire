# =========================================================
# 🏛️ BCRG HUB — Configuration Nginx Frontend & Reverse Proxy
# =========================================================

server {
    listen 80;
    server_name localhost;

    # Répertoire racine des fichiers statiques compilés
    root /usr/share/nginx/html;
    index index.html;

    # Taille maximale des téléversements (certificats, exports, logs)
    client_max_body_size 25M;

    # 1. En-têtes de Sécurité HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 2. Compression Gzip des ressources
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 3. Routage API : Relais vers le conteneur backend
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;

        # Support des WebSockets et requêtes en direct
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Transmission des en-têtes d'identité réels du client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Transmission explicite des en-têtes d'authentification (JWT Bearer + Cookies de session)
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        # Gestion des temporisations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Désactivation du cache Nginx pour l'API
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;
    }

    # 4. Cache agressif pour les assets statiques compilés (JS, CSS, Images, Polices)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 5. Routage SPA (Single Page Application) : Redirection vers index.html pour React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 6. Page d'erreur personnalisée
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
